[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dupfind"
version = "1.0.0"
description = "Hash-based duplicate file finder CLI"
authors = [{name = "Ujjwal Bhatia"}]
license = {text = "MIT"}
requires-python = ">=3.10"

[project.scripts]
dupfind = "dupfind.cli:main"

[tool.setuptools.packages.find]
include = ["dupfind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
